<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>왕열 Wang Yeul</title>
  <meta name="description" content="왕열 작가의 공식 웹사이트. 대표작품과 작품세계를 감상합니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,200;0,300;0,400;1,300&family=DM+Mono:wght@300;400&family=DM+Sans:wght@200;300;400&family=Noto+Sans+KR:wght@200;300;400&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/Wang_art/assets/main-Cv2JAgLR.js"></script>
  <link rel="stylesheet" crossorigin href="/Wang_art/assets/main-BooiQzsd.css">
</head>
<body data-page="home">

  <!-- 네비바 -->
  <header class="navbar" id="navbar">
    <div class="navbar-container">
      <a href="/Wang_art/" class="navbar-logo">왕열 Wang Yeul</a>
      <nav class="nav-menu" id="navMenu">
        <a href="/Wang_art/works/"       class="navbar-link" data-nav="works">Selected Works</a>
        <a href="/Wang_art/worlds/"      class="navbar-link" data-nav="worlds">작품세계</a>
        <a href="/Wang_art/artist/"      class="navbar-link" data-nav="artist">작가</a>
        <a href="/Wang_art/collections/" class="navbar-link" data-nav="collections">소장처</a>
      </nav>
      <div class="nav-social">
        <a href="https://www.instagram.com/wangyeul" target="_blank" rel="noopener" class="navbar-link-small">Instagram</a>
        <a href="mailto:studio@wangyeul.com" class="navbar-link-small">Email</a>
      </div>
    </div>
  </header>

  <main>
    <!-- 히어로 타이포 -->
    <section class="hero-type">
      <a href="/Wang_art/works/" class="type-hero-link" id="heroTypeLink">유토피아</a>
    </section>

    <!-- 시리즈 — Pierrick 핵심: 126px 모노 타이포 -->
    <section class="series" id="seriesSection" aria-label="시리즈">
      <span class="series-label">Series /</span>
      <div class="series-list" id="seriesList"></div>
    </section>

    <!-- 작품 그리드 -->
    <section class="wall" id="wallGrid" role="list" aria-label="작품 목록"></section>

    <!-- 뉴스레터 -->
    <section class="subscribe" aria-label="뉴스레터 구독">
      <p class="subscribe-title" data-i18n="subscribe.title">새로운 작품과 전시 소식을 받아보세요</p>
      <p class="subscribe-sub"   data-i18n="subscribe.sub">구독 취소 언제든 가능 · 이메일은 공개되지 않습니다</p>
      <form class="subscribe-form" id="subscribeForm" novalidate>
        <input class="subscribe-input" id="subscribeEmail" type="email" placeholder="이메일 주소" aria-label="이메일 주소" />
        <button class="subscribe-btn" type="submit" data-i18n="subscribe.btn">구독</button>
      </form>
      <p class="subscribe-msg" id="subscribeMsg" aria-live="polite"></p>
    </section>

    <!-- 푸터 -->
    <footer class="footer" role="contentinfo">
      <a href="/Wang_art/"                      class="footer-link footer-name">왕열 Wang Yeul</a>
      <a href="https://instagram.com/wangyeul/" target="_blank" rel="noopener" class="footer-link">Instagram @wangyeul</a>
      <a href="mailto:studio@wangyeul.com"      class="footer-link">Email</a>
    </footer>
  </main>

</body>
</html>
