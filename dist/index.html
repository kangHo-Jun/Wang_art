<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>왕열 Wang Yeul</title>
  <meta name="description" content="왕열 작가의 공식 웹사이트. 대표작품과 작품세계를 감상합니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,200;0,300;0,400;1,300&family=DM+Mono:wght@300;400&family=DM+Sans:wght@200;300;400&family=Noto+Sans+KR:wght@200;300;400&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/Wang_art/assets/gsap-D_956-p2.js"></script>
  <script type="module" crossorigin src="/Wang_art/assets/main-zslaT74I.js"></script>
  <link rel="stylesheet" crossorigin href="/Wang_art/assets/main-DTVQ0rlh.css">
</head>
<body data-page="home">

  <!-- 네비바 -->
  <header class="navbar" id="navbar">
    <a href="/Wang_art/" class="navbar-logo" aria-label="왕열 Wang Yeul 홈">
      <span class="logo-cn">王烈</span>
      <span class="logo-en">Wang Yeul</span>
    </a>
    <button class="navbar-hamburger" id="navHamburger" aria-label="메뉴 열기" aria-expanded="false">
      <svg width="20" height="14" viewBox="0 0 20 14" fill="none">
        <line x1="0" y1="1"  x2="20" y2="1"  stroke="currentColor" stroke-width="1.2"/>
        <line x1="0" y1="7"  x2="20" y2="7"  stroke="currentColor" stroke-width="1.2"/>
        <line x1="0" y1="13" x2="20" y2="13" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>
  </header>

  <!-- 메뉴 오버레이 -->
  <div class="menu-overlay" id="menuOverlay" role="dialog" aria-modal="true" aria-label="내비게이션 메뉴">
    <nav class="menu-main" aria-label="주요 메뉴">
      <a href="/Wang_art/"             data-nav="home">대표작품</a>
      <a href="/Wang_art/works/"       data-nav="works">작품</a>
      <a href="/Wang_art/worlds/"      data-nav="worlds">작품세계</a>
      <a href="/Wang_art/artist/"      data-nav="artist">작가</a>
      <a href="/Wang_art/collections/" data-nav="collections">소장처</a>
    </nav>
    <div class="menu-spacer"></div>
    <nav class="menu-sub" aria-label="언어 선택">
      <button class="lang-btn active" data-lang="ko">한국어</button>
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="ja">日本語</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </nav>
  </div>

  <main>
    <!-- 메인 비주얼 — 단일 피처 이미지 -->
    <section class="main-visual-wrapper" id="mainVisual" aria-label="대표 작품">
      <div class="main-visual-inner">
        <a class="main-visual-link" id="mainVisualLink" href="#" aria-label="작품 상세 보기">
          <img class="main-visual-img" id="mainVisualImg" src="" alt="" loading="eager" decoding="async" />
        </a>
        <div class="visual-label" id="visualLabel">
          <p class="visual-label-title" id="visualTitle"></p>
          <p class="visual-label-meta"  id="visualMeta"></p>
        </div>
      </div>
    </section>

    <!-- 시리즈 — Pierrick 핵심: 126px 모노 타이포 -->
    <section class="series" id="seriesSection" aria-label="시리즈">
      <span class="series-label">Series /</span>
      <div class="series-list" id="seriesList"></div>
    </section>

    <!-- 작품 그리드 -->
    <section class="wall" id="wallGrid" role="list" aria-label="작품 목록"></section>

    <!-- 뉴스레터 -->
    <section class="subscribe" aria-label="뉴스레터 구독">
      <p class="subscribe-title" data-i18n="subscribe.title">새로운 작품과 전시 소식을 받아보세요</p>
      <p class="subscribe-sub"   data-i18n="subscribe.sub">구독 취소 언제든 가능 · 이메일은 공개되지 않습니다</p>
      <form class="subscribe-form" id="subscribeForm" novalidate>
        <input class="subscribe-input" id="subscribeEmail" type="email" placeholder="이메일 주소" aria-label="이메일 주소" />
        <button class="subscribe-btn" type="submit" data-i18n="subscribe.btn">구독</button>
      </form>
      <p class="subscribe-msg" id="subscribeMsg" aria-live="polite"></p>
    </section>

    <!-- 푸터 -->
    <footer class="footer" role="contentinfo">
      <a href="/Wang_art/"                      class="footer-link footer-name">왕열 Wang Yeul</a>
      <a href="https://instagram.com/wangyeul/" target="_blank" rel="noopener" class="footer-link">Instagram @wangyeul</a>
      <a href="mailto:studio@wangyeul.com"      class="footer-link">Email</a>
    </footer>
  </main>

</body>
</html>
