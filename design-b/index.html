<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design B — Editorial Artist</title>
  <meta name="description" content="Wang_Art 비교용 시안 B. 작품과 작가 서사를 함께 읽는 에디토리얼 방향." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/design-showcase.css" />
</head>
<body class="design-showcase variant-b" data-variant="b">
  <div class="showcase-shell" data-showcase-root data-variant="b">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-block">
          <span class="brand-kicker">Wang_Art design study</span>
          <strong class="brand-name">Design B / Editorial Artist</strong>
        </div>
        <nav class="variant-nav" aria-label="시안 비교 내비게이션">
          <a class="variant-link" href="../design-a/">A</a>
          <a class="variant-link active" href="../design-b/">B</a>
          <a class="variant-link" href="../design-c/">C</a>
          <a class="home-link" href="../index.html">Original Home</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <section class="hero">
        <div class="hero-layout">
          <div class="hero-copy">
            <p class="eyebrow fade-in" data-hero-eyebrow></p>
            <h1 class="hero-title fade-in delay-1" data-hero-title></h1>
            <p class="hero-summary fade-in delay-2" data-hero-summary></p>
            <div class="hero-actions fade-in delay-3">
              <a class="hero-button" href="#works">Read the Works</a>
              <span class="text-button" data-page-desc></span>
            </div>
          </div>
          <div class="hero-column fade-in delay-1" data-hero-notes></div>
          <div class="hero-stage">
            <div class="hero-art fade-in delay-2">
              <img data-hero-image src="" alt="" />
              <div class="hero-meta">
                <div>
                  <p class="hero-meta-title" data-hero-meta-title></p>
                  <p class="hero-meta-sub" data-hero-meta-sub></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section" id="works">
        <div class="section-shell">
          <div class="section-heading-row">
            <div>
              <p class="section-kicker" data-works-kicker></p>
              <h2 class="section-title" data-works-title></h2>
            </div>
            <p class="section-text" data-works-text></p>
          </div>
          <div class="story-grid">
            <div class="works-grid" data-works></div>
            <div class="detail-panel" data-detail-panel>
              <div class="detail-stage">
                <img data-detail-image src="" alt="" />
                <div class="detail-copy">
                  <p class="detail-kicker" data-detail-kicker-text></p>
                  <h2 class="detail-title" data-detail-title-text></h2>
                  <div class="detail-meta" data-detail-meta-text></div>
                  <p class="detail-description" data-detail-description-text></p>
                  <div class="detail-nav">
                    <button class="quiet-button" type="button" data-detail-nav="-1">Previous</button>
                    <button class="quiet-button" type="button" data-detail-nav="1">Next</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-shell">
          <div class="section-heading-row">
            <div>
              <p class="section-kicker">Assessment</p>
              <h2 class="section-title" data-archive-title></h2>
            </div>
            <p class="section-text" data-archive-text></p>
          </div>
          <div class="archive-grid" data-archive-grid></div>
          <p class="footer-note">Artwork detail entry mode: inline reading panel. Motion intensity: medium. Navigation tone: editorial and readable.</p>
        </div>
      </section>
    </main>
  </div>
  <script src="../js/design-showcase.js"></script>
</body>
</html>
