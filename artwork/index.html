<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>작품 — 왕열 Wang Yeul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,200;0,300;0,400;1,300&family=DM+Mono:wght@300;400&family=DM+Sans:wght@200;300;400&family=Noto+Sans+KR:wght@200;300;400&display=swap" rel="stylesheet" />
</head>
<body data-page="artwork">

  <header class="navbar" id="navbar">
    <a href="/Wang_art/" class="navbar-logo">
      <span class="logo-cn">王烈</span>
      <span class="logo-en">Wang Yeul</span>
    </a>
    <button class="navbar-hamburger" id="navHamburger" aria-label="메뉴 열기" aria-expanded="false">
      <svg width="20" height="14" viewBox="0 0 20 14" fill="none">
        <line x1="0" y1="1"  x2="20" y2="1"  stroke="currentColor" stroke-width="1.2"/>
        <line x1="0" y1="7"  x2="20" y2="7"  stroke="currentColor" stroke-width="1.2"/>
        <line x1="0" y1="13" x2="20" y2="13" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>
  </header>

  <div class="menu-overlay" id="menuOverlay" role="dialog" aria-modal="true">
    <nav class="menu-main">
      <a href="/Wang_art/"             data-nav="home">대표작품</a>
      <a href="/Wang_art/works/"       data-nav="works">작품</a>
      <a href="/Wang_art/worlds/"      data-nav="worlds">작품세계</a>
      <a href="/Wang_art/artist/"      data-nav="artist">작가</a>
      <a href="/Wang_art/collections/" data-nav="collections">소장처</a>
    </nav>
    <div class="menu-spacer"></div>
    <nav class="menu-sub">
      <button class="lang-btn active" data-lang="ko">한국어</button>
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="ja">日本語</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </nav>
  </div>

  <main class="artwork-page" id="artworkPage">
    <div class="artwork-stage" id="artworkStage">
      <img class="artwork-img" id="artworkImg" src="" alt="" />
    </div>
    <div class="artwork-caption" id="artworkCaption">
      <span class="artwork-num"    id="artworkNum"></span>
      <span class="artwork-title"  id="artworkTitle"></span>
      <span class="artwork-title-kr" id="artworkTitleKr"></span>
      <span class="artwork-meta-item" id="artworkYear"></span>
      <span class="artwork-meta-item" id="artworkMedium"></span>
      <span class="artwork-meta-item" id="artworkSize"></span>
      <span class="artwork-meta-item" id="artworkCollection"></span>
    </div>
    <div class="artwork-nav" id="artworkNav">
      <button class="artwork-nav-btn" id="artworkPrev">← Prev</button>
      <a class="artwork-nav-btn" href="/Wang_art/works/" style="opacity:0.45">All Works</a>
      <button class="artwork-nav-btn" id="artworkNext">Next →</button>
    </div>
  </main>

  <div class="custom-cursor" id="customCursor" aria-hidden="true">
    <span class="custom-cursor-label">VIEW</span>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
