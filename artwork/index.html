<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>작품 — 왕열 Wang Yeul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@0,200;0,300;0,400;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/Wang_art/assets/main-CVRV9nEk.js"></script>
  <link rel="stylesheet" crossorigin href="/Wang_art/assets/main-CZZya29U.css">
</head>
<body data-page="artwork">

  <header class="navbar" id="navbar">
    <div class="navbar-container">
      <a href="../" class="navbar-link logo">王烈 Wang Yeul</a>
      <nav class="nav-menu" role="navigation">
        <a href="../works/"       class="navbar-link big" data-nav="works">Selected Works</a>
        <a href="../worlds/"      class="navbar-link big" data-nav="worlds">Worlds</a>
        <a href="../artist/"      class="navbar-link big" data-nav="artist">Artist</a>
        <a href="../contact/"     class="navbar-link big" data-nav="contact">Contact</a>
      </nav>
      <!-- 모바일 전용 햄버거 -->
      <button class="menu-btn-mobile" id="menuBtnMobile" aria-label="메뉴">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <!-- 이전/다음 투명 클릭 영역 -->
  <div class="artwork-nav-container" id="artworkNavContainer">
    <div class="nav-artwork-container c-left" id="artworkPrev">
      <a class="nav-artwork-link-block left"></a>
    </div>
    <div class="nav-separator"></div>
    <div class="nav-artwork-container c-right" id="artworkNext">
      <a class="nav-artwork-link-block right"></a>
    </div>
  </div>

  <main class="artwork-page">
    <div class="artwork-container" id="artworkContainer">
      <div class="artwork-zoom-wrap" id="artworkZoomWrap">
        <img class="artwork-image" id="artworkImg" src="" alt="" tabindex="-1" />
      </div>
      <div class="label artwork" id="artworkLabel">
        <div class="label-name"   id="labelName"></div>
        <div class="comma">, </div>
        <div class="label-year"   id="labelYear"></div>
        <div class="label-medium" id="labelMedium"></div>
        <div class="label-size"   id="labelSize"></div>
      </div>
    </div>
    <footer class="footer">
      <a href="../"                                      class="footer-link footer-name">왕열 Wang Yeul</a>
      <a href="https://www.instagram.com/wang_yeul/" target="_blank" rel="noopener noreferrer" class="footer-link igdesktop">Instagram @wang_yeul</a>
      <a href="https://www.instagram.com/wang_yeul/" target="_blank" rel="noopener noreferrer" class="footer-link ig-mobile">Instagram</a>
      <a href="mailto:wangyeul2963296@gmail.com?subject=Wang%20Yeul%20Inquiry" class="footer-link">Email</a>
    </footer>
  </main>

  <!-- Magnifier: position:fixed, overflow:hidden 영향 없음 -->
  <div class="artwork-magnifier" id="artworkMagnifier"></div>

  <!-- 모바일 전체화면 확대 오버레이 -->
  <div id="artworkZoomOverlay" role="dialog" aria-modal="true" aria-label="작품 확대 보기" hidden>
    <button id="artworkZoomClose" aria-label="닫기">&#x2715;</button>
    <div class="artwork-zoom-pan" id="artworkZoomPan">
      <img id="artworkZoomImg" alt="" />
    </div>
  </div>

</body>
</html>
