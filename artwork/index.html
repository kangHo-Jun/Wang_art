<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>작품 — 왕열 Wang Yeul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@200;300;400&family=Cormorant+Garamond:ital,wght@0,200;0,300;0,400;1,300&display=swap" rel="stylesheet" />
</head>
<body data-page="artwork">

  <header class="navbar" id="navbar">
    <div class="navbar-container">
      <a href="/Wang_art/" class="navbar-logo">왕열 Wang Yeul</a>
      <nav class="nav-menu">
        <a href="/Wang_art/works/"       class="navbar-link" data-nav="works">Selected Works</a>
        <a href="/Wang_art/worlds/"      class="navbar-link" data-nav="worlds">작품세계</a>
        <a href="/Wang_art/artist/"      class="navbar-link" data-nav="artist">작가</a>
        <a href="/Wang_art/collections/" class="navbar-link" data-nav="collections">소장처</a>
      </nav>
      <div class="nav-social">
        <a href="https://www.instagram.com/wangyeul" target="_blank" rel="noopener" class="navbar-link-small">Instagram</a>
        <a href="mailto:studio@wangyeul.com" class="navbar-link-small">Email</a>
      </div>
    </div>
  </header>

  <!-- 이전/다음 투명 클릭 영역 -->
  <div class="artwork-nav-container" id="artworkNavContainer">
    <div class="nav-artwork-container c-left" id="artworkPrev">
      <span class="nav-artwork-arrow">← Prev</span>
    </div>
    <div class="nav-separator"></div>
    <div class="nav-artwork-container c-right" id="artworkNext">
      <span class="nav-artwork-arrow">Next →</span>
    </div>
  </div>

  <main class="artwork-page">
    <div class="artwork-container" id="artworkContainer">
      <img class="artwork-image" id="artworkImg" src="" alt="" />
      <div class="label artwork" id="artworkLabel">
        <span class="label-name"  id="labelName"></span>
        <span class="comma">,</span>
        <span class="label-year"  id="labelYear"></span>
        <span class="label-medium" id="labelMedium"></span>
        <span class="label-size"  id="labelSize"></span>
      </div>
    </div>
    <footer class="footer" role="contentinfo">
      <a href="/Wang_art/" class="footer-link footer-name">왕열 Wang Yeul</a>
      <a href="https://www.instagram.com/wangyeul" target="_blank" rel="noopener" class="footer-link">Instagram</a>
      <a href="mailto:studio@wangyeul.com" class="footer-link">Email</a>
    </footer>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
